name: Weekly Security Scan

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install safety pip-audit
          pip install -r requirements.txt 2>/dev/null || true
          pip install -r requirements-dev.txt 2>/dev/null || true

      - name: Run Safety check
        run: |
          safety check \
            --full-report \
            --output safety-report.json \
            -r requirements.txt 2>/dev/null || true

      - name: Run pip-audit
        run: |
          pip-audit \
            --requirements-file requirements.txt 2>/dev/null || true

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-report
          path: safety-report.json

  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >
            p/default
            p/python
            p/javascript
            p/typescript
            p/owasp-top-ten
            p/ci
          output: semgrep-results.sarif
          json: true

      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  dast-owasp:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - name: Run OWASP ZAP Scan
        uses: zaproxy/action-full-scan@v0.11.0
        with:
          target: "https://api.staging.zambia-health.example.com"
          cmd_options: "-a -j -J zap-report.json"
          rules_file_name: ".zap/rules.tsv"
        continue-on-error: true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.json

  container-scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - "api-gateway"
          - "patient-service"
          - "clinical-service"
          - "ai-inference"
    steps:
      - name: Run Trivy on registry images
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest"
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"
        continue-on-error: true

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.sarif

  infra-scan:
    name: Infrastructure Scan - Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov on Terraform
        run: |
          checkov -d infra/terraform/ \
            --framework terraform \
            --output json \
            --output-file-path checkov-report.json \
            --skip-check CKV_AWS_88,CKV_AWS_184,CKV_AWS_145 \
            --soft-fail

      - name: Run Checkov on Kubernetes
        run: |
          checkov -d k8s/ \
            --framework kubernetes \
            --output json \
            --output-file-path checkov-k8s-report.json \
            --soft-fail

      - name: Upload Checkov Report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report.json

  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
          report-format: json
          report-path: gitleaks-report.json
        continue-on-error: true

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  generate-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs:
      - dependency-scan
      - sast-semgrep
      - dast-owasp
      - container-scan
      - infra-scan
      - secret-scan
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate summary
        run: |
          echo "# Weekly Security Scan Report" > security-report.md
          echo "" >> security-report.md
          echo "**Date:** $(date -u)" >> security-report.md
          echo "**Repository:** ${{ github.repository }}" >> security-report.md
          echo "" >> security-report.md
          echo "## Scan Results" >> security-report.md
          echo "" >> security-report.md
          echo "| Scan | Status |" >> security-report.md
          echo "|------|--------|" >> security-report.md
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> security-report.md
          echo "| SAST (Semgrep) | ${{ needs.sast-semgrep.result }} |" >> security-report.md
          echo "| DAST (OWASP ZAP) | ${{ needs.dast-owasp.result }} |" >> security-report.md
          echo "| Container Scan | ${{ needs.container-scan.result }} |" >> security-report.md
          echo "| Infrastructure Scan | ${{ needs.infra-scan.result }} |" >> security-report.md
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> security-report.md
          echo "" >> security-report.md

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md

      - name: Send security alert
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "channel": "#security",
              "username": "Security Bot",
              "attachments": [{
                "color": "danger",
                "title": "Weekly Security Scan: Issues Found",
                "text": "Security vulnerabilities detected. Check the security report for details."
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK }}
