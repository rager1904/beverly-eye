# UbuntuCare Redis configuration. The Colab Compose overlay binds Redis to
# loopback when using host networking; standard Docker bridge deployments can
# reach the container on its internal network.
bind 0.0.0.0
protected-mode yes
port 6379
timeout 0
tcp-keepalive 300
daemonize no
supervised no
loglevel notice
databases 16
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec
maxmemory-policy allkeys-lru
