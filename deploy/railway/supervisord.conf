; =============================================================================
; UbuntuCare core services on Railway.
;
; supervisord is started by scripts/railway/start_backend.py after Postgres,
; Redis, MinIO, Keycloak, and Alembic migrations are ready. Only the gateway
; binds on the Railway PORT (8000); the other services listen on loopback.
; =============================================================================

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:emr]
command=python -m uvicorn scripts.railway.asgi:create_app --factory --host 127.0.0.1 --port 8001
directory=/app
environment=UBUNTUCARE_RAILWAY_SERVICE="emr",UBUNTUCARE_RAILWAY_ENABLE_AI="0"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

