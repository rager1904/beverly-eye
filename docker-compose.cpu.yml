# =============================================================================
# CPU-only override for 16GB RAM machines (no GPU, no ELK, minimal monitoring)
# Usage: docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
# =============================================================================

services:
  # Disable GPU services
  agent-orchestrator:
    profiles: []
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"
    environment:
      LLM__MODEL_PATH: /data/models/llm/llama-2-7b-chat.Q4_K_M.gguf
      LLM__N_GPU_LAYERS: 0
      LLM__N_THREADS: 8
      LLM__USE_MLOCK: "true"

  asr:
    profiles: []
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"
    environment:
      WHISPER_MODEL_SIZE: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_MODEL_PATH: /app/models/whisper/small
    volumes:
      - ./.models/whisper:/app/models/whisper:ro

  tts:
    profiles: []
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
        reservations:
          cpus: "0.25"
          memory: "256M"
    environment:
      TTS__DEVICE: cpu

  rag:
    profiles: []
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "0.5"
          memory: "512M"
    environment:
      RAG__DEVICE: cpu
      RAG__EMBEDDING_MODEL: BAAI/bge-small-en-v1.5

  worker:
    profiles: []
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1G"
        reservations:
          cpus: "0.25"
          memory: "256M"
    environment:
      CELERY_CONCURRENCY: 2
      CELERY_QUEUES: default,emr,notifications

  celery-beat:
    profiles: []

  # Disable heavy services
  flower:
    profiles: []

  elasticsearch:
    profiles: []

  logstash:
    profiles: []

  kibana:
    profiles: []

  prometheus:
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: "512M"
        reservations:
          memory: "256M"

  grafana:
    profiles: ["monitoring"]
    deploy:
      resources:
        limits:
          memory: "256M"
        reservations:
          memory: "128M"

  # Reduce resource limits for core services
  postgres:
    deploy:
      resources:
        limits:
          memory: "2G"
        reservations:
          memory: "512M"

  redis:
    deploy:
      resources:
        limits:
          memory: "512M"
        reservations:
          memory: "128M"

  qdrant:
    deploy:
      resources:
        limits:
          memory: "1G"
        reservations:
          memory: "256M"

  weaviate:
    profiles: ["ai"]
    deploy:
      resources:
        limits:
          memory: "1G"
        reservations:
          memory: "256M"
    environment:
      ENABLE_MODULES: text2vec-transformers

  minio:
    deploy:
      resources:
        limits:
          memory: "512M"
        reservations:
          memory: "128M"

  keycloak:
    deploy:
      resources:
        limits:
          memory: "1.5G"
        reservations:
          memory: "512M"

  api-gateway:
    deploy:
      resources:
        limits:
          memory: "1G"
        reservations:
          memory: "256M"
    environment:
      UVICORN_WORKERS: 2

  emr:
    deploy:
      resources:
        limits:
          memory: "1G"
        reservations:
          memory: "256M"

  frontend:
    deploy:
      resources:
        limits:
          memory: "512M"
        reservations:
          memory: "128M"

  nginx:
    deploy:
      resources:
        limits:
          memory: "128M"
        reservations:
          memory: "64M"

  portainer:
    profiles: []