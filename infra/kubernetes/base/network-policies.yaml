apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: healthcare
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name:kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-gateway
  namespace: healthcare
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name:ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: emr-service
        - podSelector:
            matchLabels:
              app: agent-orchestrator
        - podSelector:
            matchLabels:
              app: asr-service
        - podSelector:
            matchLabels:
              app: tts-service
        - podSelector:
            matchLabels:
              app: rag-service
        - podSelector:
            matchLabels:
              app: disease-surveillance
        - podSelector:
            matchLabels:
              app: community-health
        - podSelector:
            matchLabels:
              app: medical-imaging
        - podSelector:
            matchLabels:
              app: drug-supply-chain
        - podSelector:
            matchLabels:
              app: notifications
        - podSelector:
            matchLabels:
              app: redis
        - podSelector:
            matchLabels:
              app: minio
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9000
---
