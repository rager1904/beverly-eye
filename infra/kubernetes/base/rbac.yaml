---
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: healthcare-restricted
  namespace: healthcare
  annotations:
    seccomp.security.alpha.kubernetes.io/allowedProfileNames:"runtime/default"
    seccomp.security.alpha.kubernetes.io/defaultProfileName:"runtime/default"
    apparmor.security.beta.kubernetes.io/allowedProfileNames:"runtime/default"
    apparmor.security.beta.kubernetes.io/defaultProfileName:"runtime/default"
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - "configMap"
    - "emptyDir"
    - "projected"
    - "secret"
    - "downwardAPI"
    - "persistentVolumeClaim"
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: "MustRunAsNonRoot"
  seLinux:
    rule: "RunAsAny"
  supplementalGroups:
    rule: "MustRunAs"
    ranges:
      - min: 1
        max: 65535
  fsGroup:
    rule: "MustRunAs"
    ranges:
      - min: 1
        max: 65535
  readOnlyRootFilesystem: true
---
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: healthcare-gpu
  namespace: healthcare
  annotations:
    seccomp.security.alpha.kubernetes.io/allowedProfileNames:"runtime/default"
    seccomp.security.alpha.kubernetes.io/defaultProfileName:"runtime/default"
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - "configMap"
    - "emptyDir"
    - "projected"
    - "secret"
    - "downwardAPI"
    - "persistentVolumeClaim"
    - "hostPath"
  allowedHostPaths:
    - pathPrefix: "/var/lib/nvidia"
      readOnly: true
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: "MustRunAsNonRoot"
  seLinux:
    rule: "RunAsAny"
  supplementalGroups:
    rule: "MustRunAs"
    ranges:
      - min: 1
        max: 65535
  fsGroup:
    rule: "MustRunAs"
    ranges:
      - min: 1
        max: 65535
  readOnlyRootFilesystem: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: psp-restricted
  namespace: healthcare
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: psp: restricted
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system: serviceaccounts: healthcare
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: healthcare
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
