apiVersion: v1
kind: Service
metadata:
  name: agent-orchestrator
  namespace: healthcare
  labels:
    app: agent-orchestrator
    service-type: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: agent-orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-orchestrator
  namespace: healthcare
  labels:
    app: agent-orchestrator
    service-type: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: agent-orchestrator
  template:
    metadata:
      labels:
        app: agent-orchestrator
        service-type: backend
      annotations:
        prometheus.io/scrape:"true"
        prometheus.io/port:"9090"
        prometheus.io/path:"/metrics"
    spec:
      serviceAccountName: agent-orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1003
        fsGroup: 1003
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-orchestrator
          image: ubuntucare/agent-orchestrator:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: QDRANT_HOST
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: QDRANT_HOST
            - name: QDRANT_HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: QDRANT_HTTP_PORT
            - name: WEAVIATE_HOST
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: WEAVIATE_HOST
            - name: WEAVIATE_PORT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: WEAVIATE_PORT
            - name: ASR_MODEL_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: ASR_MODEL_ENDPOINT
            - name: TTS_MODEL_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: TTS_MODEL_ENDPOINT
            - name: RAG_MODEL_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: RAG_MODEL_ENDPOINT
            - name: EMR_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: EMR_API_BASE_URL
            - name: AGENT_MAX_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: AGENT_MAX_TIMEOUT_SECONDS
            - name: AGENT_MAX_RETRIES
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: AGENT_MAX_RETRIES
            - name: AGENT_CONCURRENCY_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: AGENT_CONCURRENCY_LIMIT
            - name: AGENT_MEMORY_TTL_HOURS
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: AGENT_MEMORY_TTL_HOURS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: JWT_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: ENCRYPTION_KEY
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: LOG_LEVEL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - agent-orchestrator
                topologyKey: kubernetes.io/hostname
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-orchestrator-hpa
  namespace: healthcare
  labels:
    app: agent-orchestrator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-orchestrator
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    - type: Pods
      pods:
        metric:
          name: active_agents
        target:
          type: AverageValue
          averageValue: "5"
