apiVersion: v1
kind: Service
metadata:
  name: celery-worker
  namespace: healthcare
  labels:
    app: celery-worker
    service-type: worker
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: celery-worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: healthcare
  labels:
    app: celery-worker
    service-type: worker
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
        service-type: worker
      annotations:
        prometheus.io/scrape:"true"
        prometheus.io/port:"9090"
        prometheus.io/path:"/metrics"
    spec:
      serviceAccountName: celery-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1008
        fsGroup: 1008
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: celery-worker
          image: ubuntucare/celery-worker:latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: CELERY_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: CELERY_BROKER_URL
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: CELERY_RESULT_BACKEND
            - name: CELERY_TASK_SERIALIZER
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: CELERY_TASK_SERIALIZER
            - name: CELERY_RESULT_SERIALIZER
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: CELERY_RESULT_SERIALIZER
            - name: CELERY_ACCEPT_CONTENT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: CELERY_ACCEPT_CONTENT
            - name: CELERY_TIMEZONE
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: CELERY_TIMEZONE
            - name: CELERY_ENABLE_UTC
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: CELERY_ENABLE_UTC
            - name: CELERY_TASK_TRACK_STARTED
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: CELERY_TASK_TRACK_STARTED
            - name: CELERY_TASK_TIME_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: CELERY_TASK_TIME_LIMIT
            - name: CELERY_TASK_SOFT_TIME_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: CELERY_TASK_SOFT_TIME_LIMIT
            - name: CELERY_WORKER_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: CELERY_WORKER_CONCURRENCY
            - name: CELERY_WORKER_PREFETCH_MULTIPLIER
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: CELERY_WORKER_PREFETCH_MULTIPLIER
            - name: CELERY_WORKER_MAX_TASKS_PER_CHILD
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: CELERY_WORKER_MAX_TASKS_PER_CHILD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: LOG_LEVEL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - healthcare
                - status
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - celery-worker
                topologyKey: kubernetes.io/hostname
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: celery-worker-hpa
  namespace: healthcare
  labels:
    app: celery-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: celery-worker
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    - type: Pods
      pods:
        metric:
          name: celery_queue_length
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120
