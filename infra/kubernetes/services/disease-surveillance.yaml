apiVersion: v1
kind: Service
metadata:
  name: disease-surveillance
  namespace: healthcare
  labels:
    app: disease-surveillance
    service-type: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: disease-surveillance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: disease-surveillance
  namespace: healthcare
  labels:
    app: disease-surveillance
    service-type: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: disease-surveillance
  template:
    metadata:
      labels:
        app: disease-surveillance
        service-type: backend
      annotations:
        prometheus.io/scrape:"true"
        prometheus.io/port:"9090"
        prometheus.io/path:"/metrics"
    spec:
      serviceAccountName: disease-surveillance
      securityContext:
        runAsNonRoot: true
        runAsUser: 1010
        fsGroup: 1010
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: disease-surveillance
          image: ubuntucare/disease-surveillance:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PASSWORD
            - name: SURVEILLANCE_REPORTING_INTERVAL_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: SURVEILLANCE_REPORTING_INTERVAL_MINUTES
            - name: SURVEILLANCE_ALERT_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: SURVEILLANCE_ALERT_THRESHOLD
            - name: SURVEILLANCE_SYNDROMIC_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: SURVEILLANCE_SYNDROMIC_ENABLED
            - name: SURVEILLANCE_CONTACT_TRACING_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: SURVEILLANCE_CONTACT_TRACING_ENABLED
            - name: SURVEILLANCE_GEO_MAPPING_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: SURVEILLANCE_GEO_MAPPING_ENABLED
            - name: SURVEILLANCE_OUTBREAK_DETECTION_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: SURVEILLANCE_OUTBREAK_DETECTION_ENABLED
            - name: SURVEILLANCE_NOTIFIABLE_DISEASES
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: SURVEILLANCE_NOTIFIABLE_DISEASES
            - name: SURVEILLANCE_AGGREGATION_WINDOW_HOURS
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: SURVEILLANCE_AGGREGATION_WINDOW_HOURS
            - name: SURVEILLANCE_ANOMALY_THRESHOLD_ZSCORE
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: SURVEILLANCE_ANOMALY_THRESHOLD_ZSCORE
            - name: DHIS2_API_URL
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: DHIS2_API_URL
            - name: DHIS2_USERNAME
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: DHIS2_USERNAME
            - name: DHIS2_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: DHIS2_PASSWORD
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: LOG_LEVEL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - disease-surveillance
                topologyKey: kubernetes.io/hostname
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: disease-surveillance-hpa
  namespace: healthcare
  labels:
    app: disease-surveillance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: disease-surveillance
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
