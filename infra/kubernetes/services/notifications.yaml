apiVersion: v1
kind: Service
metadata:
  name: notifications
  namespace: healthcare
  labels:
    app: notifications
    service-type: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: notifications
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  namespace: healthcare
  labels:
    app: notifications
    service-type: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: notifications
  template:
    metadata:
      labels:
        app: notifications
        service-type: backend
      annotations:
        prometheus.io/scrape:"true"
        prometheus.io/port:"9090"
        prometheus.io/path:"/metrics"
    spec:
      serviceAccountName: notifications
      securityContext:
        runAsNonRoot: true
        runAsUser: 1014
        fsGroup: 1014
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notifications
          image: ubuntucare/notifications:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: REDIS_PASSWORD
            - name: NOTIFICATION_EMAIL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: NOTIFICATION_EMAIL_ENABLED
            - name: NOTIFICATION_SMS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: NOTIFICATION_SMS_ENABLED
            - name: NOTIFICATION_PUSH_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: NOTIFICATION_PUSH_ENABLED
            - name: NOTIFICATION_WHATSAPP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: NOTIFICATION_WHATSAPP_ENABLED
            - name: NOTIFICATION_USSD_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: NOTIFICATION_USSD_ENABLED
            - name: NOTIFICATION_RETRY_MAX_ATTEMPTS
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: NOTIFICATION_RETRY_MAX_ATTEMPTS
            - name: NOTIFICATION_RETRY_BACKOFF_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: NOTIFICATION_RETRY_BACKOFF_SECONDS
            - name: NOTIFICATION_BATCH_SIZE
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: NOTIFICATION_BATCH_SIZE
            - name: NOTIFICATION_SMS_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: NOTIFICATION_SMS_PROVIDER
            - name: NOTIFICATION_EMAIL_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: NOTIFICATION_EMAIL_PROVIDER
            - name: AFRICASTALKING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: AFRICASTALKING_API_KEY
            - name: AFRICASTALKING_USERNAME
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: AFRICASTALKING_USERNAME
            - name: AFRICASTALKING_SENDER_ID
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: AFRICASTALKING_SENDER_ID
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: SENDGRID_API_KEY
            - name: SENDGRID_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: SENDGRID_FROM_EMAIL
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: TWILIO_ACCOUNT_SID
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: TWILIO_AUTH_TOKEN
            - name: TWILIO_PHONE_NUMBER
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: TWILIO_PHONE_NUMBER
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: LOG_LEVEL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - notifications
                topologyKey: kubernetes.io/hostname
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notifications-hpa
  namespace: healthcare
  labels:
    app: notifications
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notifications
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    - type: Pods
      pods:
        metric:
          name: notification_queue_depth
        target:
          type: AverageValue
          averageValue: "50"
