apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: healthcare
  labels:
    app: rag-service
    service-type: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: rag-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: healthcare
  labels:
    app: rag-service
    service-type: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
        service-type: backend
      annotations:
        prometheus.io/scrape:"true"
        prometheus.io/port:"9090"
        prometheus.io/path:"/metrics"
    spec:
      serviceAccountName: rag-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1006
        fsGroup: 1006
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rag-service
          image: ubuntucare/rag-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: QDRANT_HOST
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: QDRANT_HOST
            - name: QDRANT_HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: QDRANT_HTTP_PORT
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-credentials
                  key: QDRANT_API_KEY
            - name: WEAVIATE_HOST
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: WEAVIATE_HOST
            - name: WEAVIATE_PORT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: WEAVIATE_PORT
            - name: WEAVIATE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weaviate-credentials
                  key: WEAVIATE_AUTHENTICATION_APIKEY_ALLOWED_KEYS
            - name: EMBEDDING_MODEL
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: RAG_EMBEDDING_MODEL
            - name: CHUNK_SIZE
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: RAG_CHUNK_SIZE
            - name: CHUNK_OVERLAP
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: RAG_CHUNK_OVERLAP
            - name: TOP_K
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: RAG_TOP_K
            - name: RERANK_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: RAG_RERANK_ENABLED
            - name: MINIO_HOST
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: MINIO_HOST
            - name: MINIO_PORT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: MINIO_PORT
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: LOG_LEVEL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: models
              mountPath: /models
              subPath: rag-models
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-storage
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - rag-service
                topologyKey: kubernetes.io/hostname
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-service-hpa
  namespace: healthcare
  labels:
    app: rag-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: queries_per_second
        target:
          type: AverageValue
          averageValue: "50"
