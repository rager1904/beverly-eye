apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  namespace: healthcare
  labels:
    app: minio
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP
  selector:
    app: minio
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: healthcare
  labels:
    app: minio
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP
  selector:
    app: minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: healthcare
  labels:
    app: minio
spec:
  serviceName: minio-headless
  replicas: 4
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
      annotations:
        prometheus.io/scrape:"true"
        prometheus.io/port:"9000"
        prometheus.io/path:"/minio/v2/metrics/cluster"
    spec:
      serviceAccountName: minio
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_BROWSER
              value: "on"
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: "public"
            - name: MINIO_REGION
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: MINIO_REGION
            - name: MINIO_STORAGE_CLASS_STANDARD
              value: "EC:2"
            - name: MINIO_BUCKET_MEDICAL_IMAGES
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: MINIO_BUCKET_MEDICAL_IMAGES
            - name: MINIO_BUCKET_AUDIO
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: MINIO_BUCKET_AUDIO
            - name: MINIO_BUCKET_DOCUMENTS
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: MINIO_BUCKET_DOCUMENTS
            - name: MINIO_BUCKET_MODELS
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: MINIO_BUCKET_MODELS
            - name: MINIO_BUCKET_BACKUPS
              valueFrom:
                configMapKeyRef:
                  name: healthcare-config
                  key: MINIO_BUCKET_BACKUPS
          command:
            - minio
          args:
            - server
            - --console-address
            - ":9001"
            - http://minio-headless.healthcare.svc.cluster.local:9000/data{1...4}
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: minio-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: minio-data
        labels:
          app: minio
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 200Gi
