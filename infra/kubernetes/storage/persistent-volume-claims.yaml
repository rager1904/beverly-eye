apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-storage
  namespace: healthcare
  labels:
    app: model-storage
    type: shared
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 200Gi
---
