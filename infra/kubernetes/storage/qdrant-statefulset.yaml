apiVersion: v1
kind: Service
metadata:
  name: qdrant-headless
  namespace: healthcare
  labels:
    app: qdrant
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: grpc
      port: 6334
      targetPort: 6334
      protocol: TCP
    - name: http
      port: 6333
      targetPort: 6333
      protocol: TCP
  selector:
    app: qdrant
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: healthcare
  labels:
    app: qdrant
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 6334
      targetPort: 6334
      protocol: TCP
    - name: http
      port: 6333
      targetPort: 6333
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: qdrant
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: healthcare
  labels:
    app: qdrant
spec:
  serviceName: qdrant-headless
  replicas: 2
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
      annotations:
        prometheus.io/scrape:"true"
        prometheus.io/port:"9090"
        prometheus.io/path:"/metrics"
    spec:
      serviceAccountName: qdrant
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.7.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 6334
              protocol: TCP
            - name: http
              containerPort: 6333
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-credentials
                  key: QDRANT_API_KEY
            - name: QDRANT__SERVICE__GRPC_PORT
              value: "6334"
            - name: QDRANT__SERVICE__HTTP_PORT
              value: "6333"
            - name: QDRANT__LOG_LEVEL
              value: INFO
            - name: QDRANT__STORAGE__PERFORMANCE__MAX_SEGMENT_NUMBER
              value: "10"
            - name: QDRANT__STORAGE__OPTIMIZERS__DEFAULT_SEGMENT_NUMBER
              value: "5"
            - name: QDRANT__STORAGE__OPTIMIZERS__MEMORY_OPTIMIZATION_THRESHOLD
              value: "4gb"
          command:
            - ./qdrant
          args:
            - --uri
            - http://qdrant-headless.healthcare.svc.cluster.local:6333
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "16Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6333
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6333
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: qdrant-data
        labels:
          app: qdrant
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 50Gi
