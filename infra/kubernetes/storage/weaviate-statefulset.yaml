apiVersion: v1
kind: Service
metadata:
  name: weaviate-headless
  namespace: healthcare
  labels:
    app: weaviate
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
  selector:
    app: weaviate
---
apiVersion: v1
kind: Service
metadata:
  name: weaviate
  namespace: healthcare
  labels:
    app: weaviate
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 50051
      targetPort: 50051
      protocol: TCP
  selector:
    app: weaviate
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: weaviate
  namespace: healthcare
  labels:
    app: weaviate
spec:
  serviceName: weaviate-headless
  replicas: 2
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: weaviate
  template:
    metadata:
      labels:
        app: weaviate
      annotations:
        prometheus.io/scrape:"true"
        prometheus.io/port:"9090"
        prometheus.io/path:"/metrics"
    spec:
      serviceAccountName: weaviate
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: weaviate
          image: semitechnologies/weaviate:1.24.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            - name: AUTHENTICATION_APIKEY_ENABLED
              valueFrom:
                secretKeyRef:
                  name: weaviate-credentials
                  key: WEAVIATE_AUTHENTICATION_APIKEY_ENABLED
            - name: AUTHENTICATION_APIKEY_ALLOWED_KEYS
              valueFrom:
                secretKeyRef:
                  name: weaviate-credentials
                  key: WEAVIATE_AUTHENTICATION_APIKEY_ALLOWED_KEYS
            - name: AUTHENTICATION_APIKEY_USERS
              valueFrom:
                secretKeyRef:
                  name: weaviate-credentials
                  key: WEAVIATE_AUTHENTICATION_APIKEY_USERS
            - name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
              value: "false"
            - name: CLUSTER_HOSTNAME
              value: "weaviate-$(POD_NAME)"
            - name: CLUSTER_GOSSIP_BIND_PORT
              value: "7100"
            - name: CLUSTER_DATA_BIND_PORT
              value: "7101"
            - name: DISABLE_TELEMETRY
              value: "true"
            - name: GOGC
              value: "50"
            - name: GOMEMLIMIT
              value: "12GiB"
            - name: GRPC_PORT
              value: "50051"
            - name: LIMIT_RESOURCES
              value: "true"
            - name: LOG_LEVEL
              value: "info"
            - name: ORIGIN
              value: "https://healthcare.zm"
            - name: PERSISTENCE_DATA_PATH
              value: "/var/lib/weaviate"
            - name: PROMETHEUS_METRICS_ENABLED
              value: "true"
            - name: QUERY_DEFAULTS_LIMIT
              value: "25"
            - name: QUERY_MAXIMUM_RESULTS
              value: "10000"
            - name: RAFT_BOOTSTRAP_EXPECT
              value: "2"
            - name: RAFT_MINIMUM_PUSH_ATTEMPTS
              value: "3"
            - name: REINDEXATION_SETUP_INITIAL_BATCH_SIZE
              value: "1000"
            - name: REINDEXATION_SETUP_PAUSE_AFTER_BATCH
              value: "100ms"
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "16Gi"
          livenessProbe:
            httpGet:
              path: /v1/.well-known/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/.well-known/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: weaviate-data
              mountPath: /var/lib/weaviate
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: weaviate-data
        labels:
          app: weaviate
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: fast-ssd
        resources:
          requests:
            storage: 50Gi
