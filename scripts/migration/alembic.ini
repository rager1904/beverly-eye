[alembic]
script_location = data/migrations
prepend_sys_path = .
sqlalchemy.url = ${DATABASE_URL}

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Version numbers for migration tracking
version_path_separator = ,
# Path to migration templates
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
# Timezone for migration timestamps
timezone = Africa/Lusaka
# Compare types for autogenerate
compare_type = True
compare_server_default = True
