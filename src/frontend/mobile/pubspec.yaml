name: ubuntucare
description: UbuntuCare - Connected healthcare for Zambia
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & State
  provider: ^6.1.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Charts
  fl_chart: ^0.66.0

  # Network & Data
  http: ^1.2.0
  graphql_flutter: ^5.1.2
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Auth & Security
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.7
  biometric_storage: ^6.0.0

  # Telemedicine
  agora_rtc_engine: ^6.2.2
  permission_handler: ^11.2.0

  # Offline & Sync
  connectivity_plus: ^5.0.2
  workmanager: ^0.5.2

  # Notifications
  firebase_messaging: ^14.7.10
  flutter_local_notifications: ^17.0.0

  # Utilities
  url_launcher: ^6.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  open_file: ^3.3.2
  share_plus: ^7.2.1
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.1
  wakelock_plus: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/i18n/
