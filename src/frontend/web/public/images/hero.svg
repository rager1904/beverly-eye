<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" rx="12"/>
  <g opacity="0.05">
    <circle cx="100" cy="100" r="200" fill="#22c55e"/>
    <circle cx="700" cy="500" r="250" fill="#3b82f6"/>
    <circle cx="400" cy="300" r="300" fill="#22c55e" opacity="0.5"/>
  </g>
  <!-- Network nodes -->
  <g opacity="0.3">
    <circle cx="400" cy="280" r="60" fill="none" stroke="#22c55e" stroke-width="1"/>
    <circle cx="400" cy="280" r="40" fill="none" stroke="#22c55e" stroke-width="0.5"/>
    <circle cx="400" cy="280" r="20" fill="#22c55e" opacity="0.4"/>
  </g>
  <!-- Satellite nodes -->
  <circle cx="280" cy="200" r="8" fill="#3b82f6" opacity="0.6"/>
  <circle cx="520" cy="200" r="8" fill="#3b82f6" opacity="0.6"/>
  <circle cx="300" cy="380" r="8" fill="#3b82f6" opacity="0.6"/>
  <circle cx="500" cy="380" r="8" fill="#3b82f6" opacity="0.6"/>
  <circle cx="220" cy="290" r="6" fill="#22c55e" opacity="0.5"/>
  <circle cx="580" cy="290" r="6" fill="#22c55e" opacity="0.5"/>
  <!-- Connections -->
  <g stroke="#22c55e" stroke-width="0.5" opacity="0.2">
    <line x1="280" y1="200" x2="400" y2="280"/>
    <line x1="520" y1="200" x2="400" y2="280"/>
    <line x1="300" y1="380" x2="400" y2="280"/>
    <line x1="500" y1="380" x2="400" y2="280"/>
    <line x1="220" y1="290" x2="400" y2="280"/>
    <line x1="580" y1="290" x2="400" y2="280"/>
    <line x1="280" y1="200" x2="520" y2="200"/>
    <line x1="300" y1="380" x2="500" y2="380"/>
  </g>
  <!-- Pulse rings -->
  <circle cx="400" cy="280" r="80" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.15">
    <animate attributeName="r" values="60;100;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="280" r="120" fill="none" stroke="#22c55e" stroke-width="0.3" opacity="0.1">
    <animate attributeName="r" values="80;140;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0;0.15" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- Heart icon center -->
  <g transform="translate(400,280)">
    <path d="M0-12 C-20-30,-40-10,-40,5 C-40,20,-20,32,0,45 C20,32,40,20,40,5 C40,-10,20,-30,0-12Z" fill="#22c55e" opacity="0.8"/>
  </g>
  <!-- AI/tech lines -->
  <g opacity="0.15">
    <rect x="290" y="195" width="6" height="2" rx="1" fill="#3b82f6"/>
    <rect x="505" y="195" width="6" height="2" rx="1" fill="#3b82f6"/>
    <rect x="540" y="225" width="4" height="2" rx="1" fill="#3b82f6"/>
    <rect x="260" y="225" width="4" height="2" rx="1" fill="#3b82f6"/>
  </g>
  <!-- AI text badge -->
  <g transform="translate(370,460)">
    <rect x="0" y="0" width="60" height="24" rx="12" fill="#16a34a" opacity="0.2"/>
    <text x="30" y="16" text-anchor="middle" fill="#22c55e" font-size="11" font-family="monospace" font-weight="bold">AI</text>
  </g>
  <g transform="translate(330,490)" opacity="0.5">
    <rect x="0" y="0" width="140" height="2" rx="1" fill="#22c55e"/>
    <rect x="0" y="6" width="100" height="2" rx="1" fill="#22c55e"/>
    <rect x="0" y="12" width="120" height="2" rx="1" fill="#22c55e"/>
  </g>
  <!-- Zambia map outline (simplified) -->
  <g transform="translate(400,520)" opacity="0.08">
    <path d="M0-10 L15-8 L20-5 L25-10 L35-8 L40-12 L45-8 L50-5 L55-10 L60-5 L55-2 L60-2 L55-5 L50-2 L45-5 L40-2 L35-5 L30-2 L25-5 L20-2 L15-5 L10-2 L5-5 L0-2Z" fill="#22c55e"/>
  </g>
</svg>
